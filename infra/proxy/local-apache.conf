# Ensaio local no macOS. Iniciar com httpd -d <diretório temporário> -f <este arquivo> -DFOREGROUND
Listen 127.0.0.1:3300
ServerName 127.0.0.1:3300
DefaultRuntimeDir .
Mutex posixsem
PidFile httpd.pid
ErrorLog error.log
LoadModule mpm_event_module /usr/libexec/apache2/mod_mpm_event.so
LoadModule unixd_module /usr/libexec/apache2/mod_unixd.so
LoadModule authz_core_module /usr/libexec/apache2/mod_authz_core.so
LoadModule rewrite_module /usr/libexec/apache2/mod_rewrite.so
LoadModule proxy_module /usr/libexec/apache2/mod_proxy.so
LoadModule proxy_http_module /usr/libexec/apache2/mod_proxy_http.so
ProxyRequests Off
ProxyPreserveHost On
RewriteEngine On
RewriteRule "^/(dashboard|admin|uploads)(/.*)?$" "/crm/$1$2" [R=307,L]
RewriteRule "^/crm/login/?$" "/login" [R=307,L]
ProxyPassMatch "^(/crm(?:/.*)?)$" "http://127.0.0.1:3302$1"
ProxyPassReverse /crm http://127.0.0.1:3302/crm
ProxyPass / http://127.0.0.1:3301/
ProxyPassReverse / http://127.0.0.1:3301/
