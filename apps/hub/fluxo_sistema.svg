<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1914"/>
      <stop offset="50%" stop-color="#122820"/>
      <stop offset="100%" stop-color="#091410"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19352b"/>
      <stop offset="100%" stop-color="#11241d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d4af37"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#52b788"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bgGrad)" stroke="#234739" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" fill="#e5c158" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1">ARQUITETURA E FLUXO DA PLATAFORMA INTERATIVA</text>

  <!-- Top Node 1: Login -->
  <g filter="url(#shadow)">
    <rect x="60" y="62" width="210" height="54" rx="27" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="2"/>
    <text x="165" y="86" text-anchor="middle" fill="#e5c158" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ETAPA 1</text>
    <text x="165" y="103" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Login do Consultor</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="270" y1="89" x2="345" y2="89" stroke="#d4af37" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <!-- Top Node 2: Central de Apresentações -->
  <g filter="url(#shadow)">
    <rect x="355" y="62" width="250" height="54" rx="12" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="2"/>
    <text x="480" y="86" text-anchor="middle" fill="#e5c158" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ETAPA 2 • HUB PRINCIPAL</text>
    <text x="480" y="103" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Central de Apresentações</text>
  </g>

  <!-- Top Node 3: Painel Admin -->
  <g filter="url(#shadow)">
    <rect x="690" y="62" width="210" height="54" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="795" y="86" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BACKOFFICE / GESTÃO</text>
    <text x="795" y="103" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Painel Administrativo</text>
  </g>

  <!-- Arrows from Central to Subgraphs -->
  <path d="M 410 116 L 410 142 L 230 142 L 230 165" fill="none" stroke="#52b788" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 540 116 L 540 142 L 650 142 L 650 165" fill="none" stroke="#d4af37" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <!-- SUBGRAPH 1: 1ª REUNIÃO -->
  <rect x="50" y="170" width="360" height="260" rx="14" fill="#0f231c" fill-opacity="0.7" stroke="#52b788" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="230" y="195" text-anchor="middle" fill="#52b788" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">FLUXO DE 1ª REUNIÃO (DIAGNÓSTICO)</text>

  <!-- Node 3: Ecossistema -->
  <g filter="url(#shadow)">
    <rect x="80" y="215" width="300" height="68" rx="10" fill="url(#cardGrad)" stroke="#52b788" stroke-width="1.5"/>
    <text x="230" y="238" text-anchor="middle" fill="#52b788" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3. APRESENTAÇÃO INSTITUCIONAL</text>
    <text x="230" y="257" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Storytelling &amp; Ecossistema 360°</text>
    <text x="230" y="273" text-anchor="middle" fill="#a3b8b0" font-family="system-ui, sans-serif" font-size="11">Crédito → Compra do Imóvel → Renda Vitalícia</text>
  </g>

  <line x1="230" y1="283" x2="230" y2="318" stroke="#52b788" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Node 4: Calculadora de Ciclos -->
  <g filter="url(#shadow)">
    <rect x="80" y="325" width="300" height="78" rx="10" fill="url(#cardGrad)" stroke="#52b788" stroke-width="1.8"/>
    <text x="230" y="348" text-anchor="middle" fill="#52b788" font-family="system-ui, sans-serif" font-size="11" font-weight="700">4. SIMULADOR PATRIMONIAL AO VIVO</text>
    <text x="230" y="367" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Calculadora Interativa de Ciclos</text>
    <text x="230" y="385" text-anchor="middle" fill="#a3b8b0" font-family="system-ui, sans-serif" font-size="11">Aporte mensal + Entrada → Projeção em 1, 3 e 5 ciclos</text>
  </g>

  <!-- SUBGRAPH 2: 2ª REUNIÃO (FECHAMENTO) -->
  <rect x="445" y="170" width="465" height="340" rx="14" fill="#142921" fill-opacity="0.7" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="677" y="195" text-anchor="middle" fill="#e5c158" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">FLUXO DE 2ª REUNIÃO (PROPOSTA &amp; FECHAMENTO)</text>

  <!-- Node 5: Personalização + Comparativo -->
  <g filter="url(#shadow)">
    <rect x="470" y="212" width="415" height="58" rx="10" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5"/>
    <text x="677" y="233" text-anchor="middle" fill="#e5c158" font-family="system-ui, sans-serif" font-size="11" font-weight="700">5. PERSONALIZAÇÃO &amp; AUTORIDADE</text>
    <text x="677" y="251" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Nome do Cliente nos Slides + Comparativo de Administradoras</text>
  </g>

  <line x1="677" y1="270" x2="677" y2="292" stroke="#d4af37" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 6: Simuladores de Crédito e Carta -->
  <g filter="url(#shadow)">
    <rect x="470" y="298" width="415" height="60" rx="10" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5"/>
    <text x="677" y="319" text-anchor="middle" fill="#e5c158" font-family="system-ui, sans-serif" font-size="11" font-weight="700">6. SIMULAÇÃO DE PROPOSTA</text>
    <text x="677" y="337" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Slider de Crédito/Parcela + Lucro na Revenda da Carta</text>
  </g>

  <line x1="677" y1="358" x2="677" y2="380" stroke="#d4af37" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- Node 7: Mapa de Assentos -->
  <g filter="url(#shadow)">
    <rect x="470" y="386" width="200" height="98" rx="10" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="570" y="410" text-anchor="middle" fill="#0b1914" font-family="system-ui, sans-serif" font-size="10" font-weight="800">7. SELEÇÃO DE COTAS</text>
    <text x="570" y="429" text-anchor="middle" fill="#0b1914" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Mapa de Assentos</text>
    <text x="570" y="447" text-anchor="middle" fill="#19352b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Escolha visual de cotas</text>
    <text x="570" y="463" text-anchor="middle" fill="#19352b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">(Sequenciais ou Separadas)</text>
  </g>

  <line x1="670" y1="435" x2="693" y2="435" stroke="#d4af37" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <!-- Node 8: Reserva CPF -->
  <g filter="url(#shadow)">
    <rect x="700" y="386" width="185" height="98" rx="10" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="792" y="410" text-anchor="middle" fill="#0b1914" font-family="system-ui, sans-serif" font-size="10" font-weight="800">8. FECHAMENTO NA CALL</text>
    <text x="792" y="429" text-anchor="middle" fill="#0b1914" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Confirmação &amp; CPF</text>
    <text x="792" y="447" text-anchor="middle" fill="#19352b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Bloqueia cotas no sistema</text>
    <text x="792" y="463" text-anchor="middle" fill="#19352b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">e gera proposta final</text>
  </g>

  <!-- Admin dashed connection to Mapa -->
  <path d="M 900 89 L 935 89 L 935 498 L 570 498 L 570 486" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <text x="755" y="518" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">Painel Admin configura taxas, grupos e disponibilidade das cotas em tempo real</text>
</svg>

